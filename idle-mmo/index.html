<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idle MMO</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<!-- ============ login / register ============ -->
<div id="auth">
  <div class="card">
    <h1>Idle MMO</h1>
    <p class="sub">Gather, craft, brew and fight. Your progress is saved to your account.</p>
    <div class="tabs">
      <button type="button" id="tab-login" class="on">Log in</button>
      <button type="button" id="tab-register">Create account</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <label>Username
        <input id="f-user" name="username" type="text" autocomplete="username" maxlength="20" required>
      </label>
      <label>Password
        <input id="f-pass" name="password" type="password" autocomplete="current-password" maxlength="72" required>
      </label>
      <label id="confirm-row" hidden>Confirm password
        <input id="f-pass2" name="password2" type="password" autocomplete="new-password" maxlength="72">
      </label>
      <button id="auth-submit" type="submit">Log in</button>
    </form>
    <p id="auth-hint" class="hint"></p>
    <p id="auth-msg"></p>
  </div>
</div>

<!-- ============ the game ============ -->
<div id="wrap" hidden>
  <div id="stage">
    <canvas id="world"></canvas>

    <div id="hud">
      <div class="meter hp"><i id="hp-fill"></i><span id="hp-text"></span></div>
      <div class="meter hg"><i id="hg-fill"></i><span id="hg-text"></span></div>
      <div id="gold"></div>
      <div id="notes"></div>
      <div id="savestate"></div>
    </div>
    <div id="toolbar">
      <button id="btn-bag" title="Backpack (I)">Backpack</button>
      <button id="btn-stats" title="Character (C)">Stats</button>
      <button id="btn-full" title="Fullscreen (F11)">Fullscreen</button>
      <button id="btn-menu" title="Menu (Esc)">Menu</button>
    </div>
    <div id="help">WASD / arrows move &nbsp;|&nbsp; E use building &nbsp;|&nbsp; I backpack &nbsp;|&nbsp; C stats &nbsp;|&nbsp; F11 fullscreen &nbsp;|&nbsp; Esc menu</div>
    <div id="log"></div>
    <div id="prompt" hidden></div>
    <div id="modal-root"></div>
  </div>
</div>

<div id="fatal" hidden></div>

<script src="js/config.js?v=1"></script>
<script src="js/data.js?v=1"></script>
<script src="js/core.js?v=1"></script>
<script src="js/draw.js?v=1"></script>
<script src="js/ui.js?v=1"></script>
<script src="js/world.js?v=1"></script>
</body>
</html>
