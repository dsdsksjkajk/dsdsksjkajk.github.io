<!DOCTYPE js>
<button id="theme-btn">Switch to Dark Mode</button>

<style>
  body { transition: background 0.5s; }
  .dark-theme { background-color: #222; color: white; }
</style>

<script>
  const btn = document.getElementById('theme-btn');
  btn.onclick = function() {
    document.body.classList.toggle('dark-theme');
    // Change button text based on mode
    if (document.body.classList.contains('dark-theme')) {
      btn.innerText = "Switch to Light Mode";
    } else {
      btn.innerText = "Switch to Dark Mode";
    }
  };
</script>
<div id="cursor-glow"></div>

<style>
  #cursor-glow {
    position: fixed;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(0,150,255,0.3) 0%, rgba(0,0,0,0) 70%);
    border-radius: 50%;
    pointer-events: none; /* Let clicks pass through */
    transform: translate(-50%, -50%);
  }
</style>

<script>
  const glow = document.getElementById('cursor-glow');
  document.onmousemove = function(e) {
    glow.style.left = e.pageX + 'px';
    glow.style.top = e.pageY + 'px';
  }
</script>
<input type="text" id="user-input" placeholder="Type a message...">
<button onclick="postMessage()">Post to Page</button>
<ul id="message-list"></ul>

<script>
  function postMessage() {
    const input = document.getElementById('user-input');
    const list = document.getElementById('message-list');
    
    if (input.value !== "") {
      const newItem = document.createElement('li');
      newItem.textContent = input.value;
      list.appendChild(newItem);
      input.value = ""; // Clear the box
    }
  }
</script>
