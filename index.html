<!DOCTYPE html>
<html>
<head>
    <title>My GitHub Site</title>
</head>
<body>
    <h1>Hello World!</h1>
    <p>My website is officially live on GitHub.</p>
</body>
</html>
<div class="floating">🚀</div>

<style>
.floating {
  font-size: 80px;
  display: inline-block;
  animation: float 3s ease-in-out infinite;
}

<button id="theme-btn">Switch to Dark Mode</button>

<style>
  body { transition: background 0.5s; }
  .dark-theme { background-color: #222; color: white; }
</style>

<script>
  const btn = document.getElementById('theme-btn');
  btn.onclick = function() {
    document.body.classList.toggle('dark-theme');
    // Change button text based on mode
    if (document.body.classList.contains('dark-theme')) {
      btn.innerText = "Switch to Light Mode";
    } else {
      btn.innerText = "Switch to Dark Mode";
    }
  };
</script>
}
</style>
