<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dsdsksjkajk</title>
<meta name="description" content="A few small things I've built.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1013; --panel:#171A1F; --line:#2A2E35;
  --text:#ECE9E4; --muted:#8B8F98; --accent:#E8A33D;
  color-scheme: dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;
  font:400 16px/1.6 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,30%), rgba(232,163,61,.10), transparent 70%);
  transition:background .15s ease-out}

.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:18vh 20px 10vh}

.prompt{font:500 15px/1 'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--accent);
  margin:0 0 18px;letter-spacing:.01em}
.prompt::before{content:"$ ";opacity:.6}

h1{margin:0 0 10px;font:700 clamp(32px,7vw,48px)/1.1 'JetBrains Mono',ui-monospace,Menlo,monospace;
  letter-spacing:-0.01em}
p.lede{margin:0 0 56px;color:var(--muted);font-size:16px;max-width:46ch}

h2.label{margin:0 0 14px;font:500 13px/1 'Inter',sans-serif;color:var(--muted);font-weight:500}

.projects{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.projects li{border-bottom:1px solid var(--line)}
.proj{display:flex;align-items:baseline;gap:18px;justify-content:space-between;
  padding:20px 4px;text-decoration:none;color:var(--text);transition:padding-left .15s ease, color .15s ease}
.proj:hover,.proj:focus-visible{padding-left:10px;color:var(--accent)}
.proj-name{font:600 18px/1.3 'Inter',sans-serif}
.proj-desc{display:block;margin-top:3px;font-size:14px;color:var(--muted);font-weight:400}
.proj:hover .proj-desc{color:var(--muted)}
.proj-tag{flex:none;font:500 12px/1 'JetBrains Mono',ui-monospace,monospace;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.proj:hover .proj-tag{border-color:var(--accent);color:var(--accent)}

footer{margin-top:70px;color:var(--muted);font-size:13px}

@media (max-width:520px){
  .wrap{padding-top:14vh}
  .proj{flex-direction:column;align-items:flex-start;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="glow" aria-hidden="true"></div>

<div class="wrap">
  <p class="prompt">whoami</p>
  <h1>dsdsksjkajk</h1>
  <p class="lede">A few small things I've built, collected here so I don't lose the links.</p>

  <h2 class="label">Projects</h2>
  <ul class="projects">
    <li>
      <a class="proj" href="flatmmo/">
        <span>
          <span class="proj-name">FlatMMO price tracker</span>
          <span class="proj-desc">Charts item prices over time and flags underpriced listings on the market.</span>
        </span>
        <span class="proj-tag">Open</span>
      </a>
    </li>
  </ul>

  <footer>More soon.</footer>
</div>

<script>
(function(){
'use strict';
var glow = document.getElementById('glow');
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || window.matchMedia('(hover: none)').matches) return;
window.addEventListener('pointermove', function(e){
  glow.style.setProperty('--mx', e.clientX + 'px');
  glow.style.setProperty('--my', e.clientY + 'px');
});
})();
</script>
</body>
</html>
